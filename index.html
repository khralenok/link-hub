<html lang="en">

      function gtag() {

      }
      gtag("js", new Date());

      gtag("config", "G-0RG9SMW70T");

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Web Design, Web Development, Website Creation"
    />
    <meta
      name="description"
      content="Grigorii Khralenok's Link Hub - Learn more about Web Development and web Design"
    />
    <meta name="author" content="Grigorii Khralenok" />
    <meta property="og:title" content="Khralenok - Link Hub" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khralenok.github.io/link-hub/" />
    <meta
      property="og:image"
      content="https://khralenok.github.io/link-hub/images/og-cover.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      name="thumbnail"
      content="https://khralenok.github.io/link-hub/images/og-cover.jpg"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Grigorii Khralenok - Web Design and Development</title>
  </head>
  <body>
    <section id="link-hub">
      <div class="container">
        <div class="component">
          <div class="wrapper">
            <div class="avatar">
              <img src="images/avatar.webp" width="153" height="153" />
            </div>
            <div class="molecule vertical">
              <h1>Grigorii Khralenok</h1>
              <p>Web Design and Development</p>
            </div>
          </div>

          <ul class="wrapper">
            <li class="card">
              <div class="thumbnail">
                <img
                  id="youtube-thumbnail"
                  src="https://img.youtube.com/vi/-SCSxAXC6Ts/maxresdefault.jpg"
                  width="288"
                  height="162"
                />
              </div>
              <p id="youtube-title">A-12. Post-apo boy. Timelapse</p>
              <a
                id="youtube-link"
                class="button"
                href="https://www.youtube.com/@khralenok_com"
                target="_blank"
                >Watch on YouTube</a
              >
            </li>
            <li class="card">
              <div class="molecule">
                <img src="images/telegram.svg" alt="Telegram icon" />
                <a href="https://t.me/khralenok_com" target="_blank"
                  >Telegram</a
                >
              </div>
            </li>

            <li class="card">
              <div class="molecule">
                <img src="images/website.svg" alt="Telegram icon" />
                <a href="https://khralenok.com/" target="_blank">Website</a>
              </div>
            </li>
          </ul>
          <form
            class="card"
            method="POST"
            action="https://formspree.io/f/mldjgzpd"
          >
            <p>Subscribe to newsletter</p>
            <div class="molecule vertical">
              <label for="name">Name:</label>
              <input
                name="name"
                type="text"
                id="name"
                placeholder="Enter your name"
              />
            </div>
            <div class="molecule vertical">
              <label for="email">Email:</label>
              <input
                name="email"
                type="email"
                id="email"
                placeholder="Enter your email"
              />
            </div>
            <div class="molecule">
              <input class="button" type="submit" value="Submit" />
            </div>
          </form>
        </div>
      </div>
    </section>
    <script>
      const API_KEY = "AIzaSyCovcM5FN_doJDs7yRuDs8LrAMob-MXJYA";
      const CHANNEL_ID = "UCsaurqTzPbEaKiO5JnhezEA";

      async function fetchLatestVideo() {
        const response = await fetch(
          `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${CHANNEL_ID}&part=snippet&type=video&order=date&maxResults=1`
        );
        const data = await response.json();
        const video = data.items[0];

        if (!video) return;

        const thumbnail = document.getElementById("youtube-thumbnail");
        const title = document.getElementById("youtube-title");
        const link = document.getElementById("youtube-link");

        link.href = `https://www.youtube.com/watch?v=${video.id.videoId}`;
        thumbnail.src = `https://img.youtube.com/vi/${video.id.videoId}/maxresdefault.jpg`;
        title.innerText = video.snippet.title;
      }

      document.addEventListener("DOMContentLoaded", fetchLatestVideo);
    </script>
  </body>
</html>
